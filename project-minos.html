<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Minos</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block;
    background: #000;
    image-rendering: pixelated;
    max-width: 100vw;
    max-height: 100vh;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="640"></canvas>
<script>
"use strict";

// ============================================================
// Config
// ============================================================
const TILE = 32;            // pixels per tile
const VIEW_W = 960;         // screen size in pixels
const VIEW_H = 640;
const ROOM_W = 30;          // test arena size in tiles (exactly one screen)
const ROOM_H = 20;

// Maze floors are built on a grid of cells. A cell is CELL x CELL tiles: a
// 2x2 floor patch plus the wall line it shares with its neighbours, so every
// hallway is 2 tiles wide. Cell (cx, cy) has floor tiles
// (3cx+1 .. 3cx+2, 3cy+1 .. 3cy+2); walls sit on multiples of 3.
const CELL = 3;
const FLOOR_CELLS = 31;     // floor size in cells for now (31 x 31 cells = 94 x 94 tiles)

// Maze generation
const BRANCH_CHANCE = 0.4;  // chance each side of a new cell opens into untouched space (q)

// Torchlight
const TORCH_RADIUS = 6.5 * TILE;  // you can see this far (blocked by walls)
const TORCH_FULL = 3 * TILE;      // fully bright out to here, then fades
const EXPLORED_DARK = 0.72;       // darkness over places you've seen but can't see now
// Cells are created this far from you: comfortably past the torchlight, so
// you never see unbuilt space or a wall turning into an opening.
const GEN_RADIUS = TORCH_RADIUS + 2 * CELL * TILE;
const STEP = 1 / 60;        // fixed simulation step, seconds

const PLAYER_SIZE = 22;     // player hitbox, pixels (square)
const PLAYER_SPEED = 180;   // pixels per second
const PLAYER_MAX_HP = 5;
const PLAYER_IFRAMES = 0.8; // invincible this long after taking a hit

// Sword (all times in seconds, angles in radians). Player and skeletons share these.
const SWING_TIME = 0.198;         // how long one swing lasts
const SWING_COOLDOWN = 0.108;     // pause after a swing before the next can start
const SWING_ARC = Math.PI * 2 / 3; // 120 degrees, centered on facing
const SWING_REACH = 40;           // blade tip distance from swinger's center, pixels
const CHAIN_GRACE = 0.108;        // a press this long after a swing ends still chains (repeats its direction)
const FACING_LOCK_EXTRA = 0.08;   // facing stays locked this long after a swing ends
const SWING_MOVE_MULT = 0.5;      // movement speed while swinging
const SWING_BUFFER = 0.12;        // a press this close to the end of a swing queues the next one

// Getting hit
const KNOCKBACK_SPEED = 300;      // initial knockback speed, pixels per second
const KNOCKBACK_TIME = 0.12;      // knockback slows to a stop over this long
const HIT_FLASH = 0.12;           // white flash when hit

// Skeletons
// Every skeleton has a difficulty from 0 (max easy) to 1 (max hard). Each stat
// is blended between the two profiles below, so skeletons can sit anywhere on
// that continuum. HP is rounded to a whole number of hits.
const SKEL_SIZE = PLAYER_SIZE;    // same body as the player
const SKELETON_EASY = {
  hp: 2,                  // sword hits to kill
  damage: 1,              // player HP lost per hit
  speed: 110,             // chase speed, px/s (player is 180)
  wanderSpeed: 40,        // idle wandering speed
  aggroRange: 220,        // notices the player within this distance (center to center)
  leashRange: 380,        // gives up the chase beyond this distance
  attackRange: 38,        // starts an attack when this close (center to center)
  stopRange: 30,          // doesn't walk closer than this
  windup: 0.35,           // telegraph before swinging, s
  cooldown: 0.7,          // pause after a swing, s
  stun: 0.3,              // can't act this long after being hit (cancels its attack), s
  swingTime: 0.198,       // same swing speed as the player
  swingArc: Math.PI / 2,  // 90 degrees (player: 120)
  swingReach: 32,         // px from center (player: 40)
};
// Max hard. hp and damage are deliberately the same as easy for now: they
// can't be placed meaningfully until there's a maze and other enemy types.
const SKELETON_HARD = Object.assign({}, SKELETON_EASY, {
  speed: 200,             // faster than the player
  aggroRange: 320,
  leashRange: 550,
  attackRange: 49,        // matches its longer reach
  windup: 0.12,           // very little warning
  cooldown: 0.595,        // 15% shorter pause between swings than easy (0.7)
  swingArc: Math.PI * 3 / 4, // 135 degrees
  swingReach: 43,
});

function lerp(a, b, t) { return a + (b - a) * t; }

function skeletonStats(difficulty) {
  const t = Math.max(0, Math.min(1, difficulty));
  const out = {};
  for (const k of Object.keys(SKELETON_EASY)) out[k] = lerp(SKELETON_EASY[k], SKELETON_HARD[k], t);
  out.hp = Math.round(out.hp);
  return out;
}

// Room waves (for testing combat in a single room)
const WAVE_SIZE = 3;
const WAVE_DELAY = 2;             // seconds after a wave dies before the next appears
const SPAWN_MIN_DIST = 250;       // skeletons spawn at least this far from the player

// Tile types
const FLOOR = 0;
const WALL = 1;
const VOID = 2;   // solid emptiness outside a room (drawn black)
const HEAL = 3;   // aquamarine floor: standing on it heals
const DOOR = 4;   // open doorway (walkable)
const NPC = 5;    // the tile the NPC stands on (solid)

// Safe room
const HEAL_INTERVAL = 0.5;        // seconds per 1 HP healed while on a heal tile
const NPC_TALK_RANGE = 80;        // NPC speaks when the player is this close (center to center)

// What the NPC says. He picks from the deepest group the player has reached
// (by deepest floor), and moves to a new line each time you walk up to him.
const NPC_LINES = [
  { minFloor: 0, lines: [
    "Ah. Another one. Good. The maze needs walking.",
    "Past that door the halls twist and turn. Somewhere there are stairs down. Find them.",
    "Hurt? Stand in the green. It mends what the skeletons break.",
    "Don't just stand there. The maze won't explore itself.",
  ] },
  { minFloor: 3, lines: [
    "Still breathing? Then you're not deep enough yet.",
    "The deeper halls remember who walks them. Keep going.",
  ] },
  { minFloor: 6, lines: [
    "Few get this far. Fewer come back. Go on, then.",
  ] },
];

// ============================================================
// Random numbers (seeded, so tests are repeatable)
// ============================================================
function makeRng(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ============================================================
// Room
// ============================================================
// A room is a grid of tiles. For now: floor everywhere, walls on the border.
function makeRoom(w, h) {
  const tiles = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const edge = x === 0 || y === 0 || x === w - 1 || y === h - 1;
      tiles[y * w + x] = edge ? WALL : FLOOR;
    }
  }
  return { w, h, tiles };
}

function tileAt(room, tx, ty) {
  if (tx < 0 || ty < 0 || tx >= room.w || ty >= room.h) return WALL;
  return room.tiles[ty * room.w + tx];
}

function isSolid(room, tx, ty) {
  const t = tileAt(room, tx, ty);
  return t === WALL || t === VOID || t === NPC;
}

function isWalkable(t) {
  return t === FLOOR || t === HEAL || t === DOOR;
}

// ---------- Maze floors ----------
// A floor is a big tile map (mostly VOID = unexplored) built from cells.
function makeFloorGrid(cellsW, cellsH) {
  const w = cellsW * CELL + 1, h = cellsH * CELL + 1;
  return { w, h, cellsW, cellsH, tiles: new Uint8Array(w * h).fill(VOID) };
}

function setTileRaw(room, x, y, t) {
  if (x >= 0 && y >= 0 && x < room.w && y < room.h) room.tiles[y * room.w + x] = t;
}

const setTile = setTileRaw;

// Make a cell's 2x2 patch walkable.
function carveCell(room, cx, cy) {
  for (let dy = 1; dy <= 2; dy++)
    for (let dx = 1; dx <= 2; dx++) setTile(room, cx * CELL + dx, cy * CELL + dy, FLOOR);
}

// Open the wall between a cell and its neighbour (dir: "n", "s", "e" or "w").
// Doorway tiles stay doorways.
function openEdge(room, cx, cy, dir) {
  const bx = cx * CELL, by = cy * CELL;
  const setTile = (r, x, y, t) => { if (tileAt(r, x, y) !== DOOR) setTileRaw(r, x, y, t); };
  if (dir === "n") { setTile(room, bx + 1, by, FLOOR); setTile(room, bx + 2, by, FLOOR); }
  if (dir === "s") { setTile(room, bx + 1, by + CELL, FLOOR); setTile(room, bx + 2, by + CELL, FLOOR); }
  if (dir === "w") { setTile(room, bx, by + 1, FLOOR); setTile(room, bx, by + 2, FLOOR); }
  if (dir === "e") { setTile(room, bx + CELL, by + 1, FLOOR); setTile(room, bx + CELL, by + 2, FLOOR); }
}

// Every VOID tile touching walkable ground (including diagonally) becomes wall.
function wallUp(room) {
  for (let y = 0; y < room.h; y++)
    for (let x = 0; x < room.w; x++) {
      if (tileAt(room, x, y) !== VOID) continue;
      let touches = false;
      for (let dy = -1; dy <= 1 && !touches; dy++)
        for (let dx = -1; dx <= 1 && !touches; dx++) {
          const t = tileAt(room, x + dx, y + dy);
          if (isWalkable(t) || t === NPC) touches = true;
        }
      if (touches) setTile(room, x, y, WALL);
    }
}

// Floor 1: the safe room sits in the middle of the floor, filling a block of
// 7 x 6 cells. It has a healing nook in its top wall, the Old Man, and a
// 2-wide doorway in its bottom wall that lines up with the cell below it, so
// the maze can grow from there.
function makeFirstFloor(cells) {
  const n = cells || FLOOR_CELLS;                        // odd, at least 9
  const room = makeFloorGrid(n, n);
  const c = Math.floor(n / 2);                           // centre cell
  const bx0 = (c - 3) * CELL, by0 = (c - 3) * CELL;      // safe block's top-left tile
  // Room floor: 20 x 14 tiles.
  const fx0 = bx0 + 1, fx1 = bx0 + 7 * CELL - 1;
  const fy0 = by0 + 4, fy1 = by0 + 6 * CELL - 1;
  for (let y = fy0; y <= fy1; y++) for (let x = fx0; x <= fx1; x++) setTile(room, x, y, FLOOR);
  // Healing nook: 4 wide, 2 deep, cut into the top wall.
  const mid = c * CELL + 1;                              // left floor column of the centre cell
  for (let y = fy0 - 2; y <= fy0 - 1; y++)
    for (let x = mid - 1; x <= mid + 2; x++) setTile(room, x, y, HEAL);
  // Doorway in the bottom wall, lined up with the centre cell's columns.
  const doorY = fy1 + 1;
  setTile(room, mid, doorY, DOOR);
  setTile(room, mid + 1, doorY, DOOR);
  // The Old Man, right of centre.
  const npc = { tx: fx0 + 13, ty: fy0 + 4 };
  setTile(room, npc.tx, npc.ty, NPC);

  // Cell bookkeeping for the maze. The safe room's 7x6 block is reserved;
  // its only way out is the doorway, which opens into the cell below it.
  initCells(room);
  for (let cy = c - 3; cy <= c + 2; cy++)
    for (let cx = c - 3; cx <= c + 3; cx++) {
      room.cells[cy * room.cellsW + cx] = CELL_RESERVED;
      for (const d of DIRS) {
        const n = neighbour(room, cx, cy, d);
        if (n && room.cells[n.cy * room.cellsW + n.cx] !== CELL_RESERVED) setEdge(room, cx, cy, d, EDGE_WALL);
      }
    }
  setEdge(room, c, c + 2, "s", EDGE_OPEN);
  claim(room, c, c + 3, c, c + 2, "s");

  wallUp(room);
  room.npc = npc;
  room.safeRect = { x0: fx0, y0: fy0 - 2, x1: fx1, y1: fy1 };   // tiles, inclusive
  room.healTile = { tx: mid, ty: fy0 - 1 };
  room.door = { tx: mid, ty: doorY };
  room.spawn = { x: ((fx0 + fx1 + 1) / 2) * TILE, y: ((fy0 + fy1 + 1) / 2) * TILE }; // pixel centre
  return room;
}

// ---------- Maze generation ----------
// Each cell is ungenerated, generated, or reserved (the safe room). Each wall
// between two cells is undecided, wall, or open. An ungenerated cell that an
// open wall leads into is "claimed": it's on the frontier, waiting to be built.
const CELL_EMPTY = 0, CELL_BUILT = 1, CELL_RESERVED = 2;
const EDGE_UNDECIDED = -1, EDGE_WALL = 0, EDGE_OPEN = 1;
const DIRS = ["n", "e", "s", "w"];
const DIR_STEP = { n: [0, -1], e: [1, 0], s: [0, 1], w: [-1, 0] };
const OPPOSITE = { n: "s", e: "w", s: "n", w: "e" };

function initCells(room) {
  const W = room.cellsW, H = room.cellsH;
  room.cells = new Uint8Array(W * H);                     // CELL_*
  room.claimed = new Uint8Array(W * H);                   // 1 = on the frontier
  room.edgeH = new Int8Array((W - 1) * H).fill(EDGE_UNDECIDED); // between (cx,cy) and (cx+1,cy)
  room.edgeV = new Int8Array(W * (H - 1)).fill(EDGE_UNDECIDED); // between (cx,cy) and (cx,cy+1)
  room.frontier = [];                                     // [{ cx, cy, from: {cx, cy, dir} }]
  room.builtCount = 0;
  room.seen = new Uint8Array(room.w * room.h);            // tiles you've ever seen
  room.visible = new Uint8Array(room.w * room.h);         // tiles you can see right now
  room.visList = [];
}

function neighbour(room, cx, cy, dir) {
  const [dx, dy] = DIR_STEP[dir];
  const nx = cx + dx, ny = cy + dy;
  if (nx < 0 || ny < 0 || nx >= room.cellsW || ny >= room.cellsH) return null;
  return { cx: nx, cy: ny };
}

function edgeSlot(room, cx, cy, dir) {
  if (!neighbour(room, cx, cy, dir)) return null;
  const W = room.cellsW;
  if (dir === "e") return { arr: room.edgeH, i: cy * (W - 1) + cx };
  if (dir === "w") return { arr: room.edgeH, i: cy * (W - 1) + cx - 1 };
  if (dir === "s") return { arr: room.edgeV, i: cy * W + cx };
  return { arr: room.edgeV, i: (cy - 1) * W + cx };
}

function getEdge(room, cx, cy, dir) {
  const e = edgeSlot(room, cx, cy, dir);
  return e ? e.arr[e.i] : EDGE_WALL;
}

function setEdge(room, cx, cy, dir, v) {
  const e = edgeSlot(room, cx, cy, dir);
  if (e) e.arr[e.i] = v;
}

function cellState(room, cx, cy) { return room.cells[cy * room.cellsW + cx]; }

// Put an ungenerated cell on the frontier, reached through (fromCx, fromCy, dir).
function claim(room, cx, cy, fromCx, fromCy, dir) {
  room.claimed[cy * room.cellsW + cx] = 1;
  room.frontier.push({ cx, cy, from: { cx: fromCx, cy: fromCy, dir } });
}

function cellCentre(cx, cy) {
  return { x: (cx * CELL + 2) * TILE, y: (cy * CELL + 2) * TILE };
}

// Walls go up only around the new cell (the rest of the floor is unchanged).
function wallUpAround(room, cx, cy) {
  const x0 = cx * CELL - 1, y0 = cy * CELL - 1;
  for (let y = y0; y <= y0 + CELL + 2; y++)
    for (let x = x0; x <= x0 + CELL + 2; x++) {
      if (tileAt(room, x, y) !== VOID) continue;
      let touches = false;
      for (let dy = -1; dy <= 1 && !touches; dy++)
        for (let dx = -1; dx <= 1 && !touches; dx++)
          if (isWalkable(tileAt(room, x + dx, y + dy))) touches = true;
      if (touches) setTile(room, x, y, WALL);
    }
}

// Build one frontier cell: carve it, open the way in, and decide its other sides.
function buildCell(game, entry) {
  const room = game.room, rng = game.rng;
  const { cx, cy, from } = entry;
  room.frontier = room.frontier.filter((f) => f !== entry);
  room.claimed[cy * room.cellsW + cx] = 0;
  room.cells[cy * room.cellsW + cx] = CELL_BUILT;
  room.builtCount++;
  carveCell(room, cx, cy);
  openEdge(room, from.cx, from.cy, from.dir);

  // Decide the other sides, in random order.
  const dirs = DIRS.slice();
  for (let i = dirs.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [dirs[i], dirs[j]] = [dirs[j], dirs[i]]; }
  const openable = []; // sides that lead into untouched space
  for (const d of dirs) {
    const n = neighbour(room, cx, cy, d);
    if (!n || getEdge(room, cx, cy, d) !== EDGE_UNDECIDED) continue;
    const untouched = cellState(room, n.cx, n.cy) === CELL_EMPTY && !room.claimed[n.cy * room.cellsW + n.cx];
    if (untouched) openable.push({ d, n });
    if (untouched && rng() < BRANCH_CHANCE) {
      setEdge(room, cx, cy, d, EDGE_OPEN);
      claim(room, n.cx, n.cy, cx, cy, d);
    } else {
      setEdge(room, cx, cy, d, EDGE_WALL); // no loops yet: never open into built or claimed cells
    }
  }

  // Never seal off untouched space: if walling a side would leave the space
  // behind it with no other way in, open this side instead. (This cell is
  // being built out of sight, so the opening is never one you've seen.)
  for (const { d, n } of openable) {
    if (getEdge(room, cx, cy, d) === EDGE_OPEN) continue;
    if (room.claimed[n.cy * room.cellsW + n.cx] || cellState(room, n.cx, n.cy) !== CELL_EMPTY) continue;
    if (!regionHasWayIn(room, n.cx, n.cy)) {
      setEdge(room, cx, cy, d, EDGE_OPEN);
      claim(room, n.cx, n.cy, cx, cy, d);
    }
  }

  // Backstop: never let the maze close off while untouched space remains.
  if (room.frontier.length === 0) {
    if (openable.length > 0) {
      const pick = openable[Math.floor(rng() * openable.length)];
      setEdge(room, cx, cy, pick.d, EDGE_OPEN);
      claim(room, pick.n.cx, pick.n.cy, cx, cy, pick.d);
    } else {
      forceOpening(game);
    }
  }
  wallUpAround(room, cx, cy);
}

// Is the patch of untouched cells containing (cx, cy) next to a frontier cell?
// (A frontier cell is still to be built, so it can still open into the patch.)
function regionHasWayIn(room, cx, cy) {
  const W = room.cellsW;
  const seen = new Set([cy * W + cx]), stack = [[cx, cy]];
  while (stack.length) {
    const [x, y] = stack.pop();
    for (const d of DIRS) {
      const n = neighbour(room, x, y, d);
      if (!n) continue;
      const j = n.cy * W + n.cx;
      if (room.claimed[j]) return true;
      if (cellState(room, n.cx, n.cy) !== CELL_EMPTY || seen.has(j)) continue;
      seen.add(j);
      stack.push([n.cx, n.cy]);
    }
  }
  return false;
}

// Last resort: open a wall somewhere between a built cell and untouched space.
// Prefers walls the player has never seen, then ones not in view right now.
function forceOpening(game) {
  const room = game.room, rng = game.rng;
  const unseen = [], hidden = [], shown = [];
  for (let cy = 0; cy < room.cellsH; cy++)
    for (let cx = 0; cx < room.cellsW; cx++) {
      if (cellState(room, cx, cy) !== CELL_BUILT) continue;
      for (const d of DIRS) {
        const n = neighbour(room, cx, cy, d);
        if (!n || cellState(room, n.cx, n.cy) !== CELL_EMPTY || room.claimed[n.cy * room.cellsW + n.cx]) continue;
        const bx = cx * CELL, by = cy * CELL;
        const wx = d === "e" ? bx + CELL : d === "w" ? bx : bx + 1;
        const wy = d === "s" ? by + CELL : d === "n" ? by : by + 1;
        const i = wy * room.w + wx;
        (room.visible[i] ? shown : room.seen[i] ? hidden : unseen).push({ cx, cy, d, n });
      }
    }
  room.forcedCount = (room.forcedCount || 0) + 1;
  const pool = unseen.length ? unseen : hidden.length ? hidden : shown;
  if (!pool.length) return; // the floor is full
  const pick = pool[Math.floor(rng() * pool.length)];
  setEdge(room, pick.cx, pick.cy, pick.d, EDGE_OPEN);
  claim(room, pick.n.cx, pick.n.cy, pick.cx, pick.cy, pick.d);
}

// Build every frontier cell within GEN_RADIUS of the player (repeats, since
// new cells can put more of the frontier in range).
function growMaze(game) {
  const room = game.room;
  if (!room.frontier) return;
  const pc = centerOf(game.player);
  for (let guard = 0; guard < 500; guard++) {
    const next = room.frontier.find((f) => {
      const c = cellCentre(f.cx, f.cy);
      return Math.hypot(c.x - pc.x, c.y - pc.y) <= GEN_RADIUS;
    });
    if (!next) break;
    buildCell(game, next);
  }
}

// ---------- Torchlight ----------
const LOS_POINTS = [[0.5, 0.5], [0.15, 0.15], [0.85, 0.15], [0.15, 0.85], [0.85, 0.85]];
// A tile is visible if a straight line from the player reaches it without
// passing through anything solid first. Everything visible is remembered.
function computeVisibility(game) {
  const room = game.room;
  if (!room.visible) return;
  for (const i of room.visList) room.visible[i] = 0;
  room.visList.length = 0;
  const mark = (x, y) => {
    const i = y * room.w + x;
    if (!room.visible[i]) { room.visible[i] = 1; room.seen[i] = 1; room.visList.push(i); }
  };
  const pc = centerOf(game.player);
  const r = Math.ceil(TORCH_RADIUS / TILE);
  const ptx = Math.floor(pc.x / TILE), pty = Math.floor(pc.y / TILE);
  const step = TILE / 4;
  for (let ty = pty - r; ty <= pty + r; ty++)
    for (let tx = ptx - r; tx <= ptx + r; tx++) {
      if (tx < 0 || ty < 0 || tx >= room.w || ty >= room.h) continue;
      const dist = Math.hypot((tx + 0.5) * TILE - pc.x, (ty + 0.5) * TILE - pc.y);
      if (dist > TORCH_RADIUS) continue;
      // Visible if a clear line reaches any of 5 points on the tile (its centre
      // or its four inner corners), so wall corners don't leave dark gaps.
      for (const [ox, oy] of LOS_POINTS) {
        const gx = (tx + ox) * TILE, gy = (ty + oy) * TILE;
        const n = Math.max(1, Math.ceil(Math.hypot(gx - pc.x, gy - pc.y) / step));
        let blocked = false;
        for (let k = 1; k < n; k++) {
          const sx = Math.floor((pc.x + (gx - pc.x) * (k / n)) / TILE);
          const sy = Math.floor((pc.y + (gy - pc.y) * (k / n)) / TILE);
          if (sx === tx && sy === ty) break;
          if (isSolid(room, sx, sy)) { blocked = true; break; }
        }
        if (!blocked) { mark(tx, ty); break; }
      }
    }
  // The safe room is lit: inside it you see all of it.
  if (inSafeRoom(game)) {
    const sr = room.safeRect;
    for (let y = sr.y0 - 1; y <= sr.y1 + 1; y++)
      for (let x = sr.x0 - 1; x <= sr.x1 + 1; x++) if (tileAt(room, x, y) !== VOID) mark(x, y);
  }
}

function inSafeRoom(game) {
  const r = game.room.safeRect;
  if (!r) return false;
  const c = centerOf(game.player);
  const tx = Math.floor(c.x / TILE), ty = Math.floor(c.y / TILE);
  return tx >= r.x0 && tx <= r.x1 && ty >= r.y0 && ty <= r.y1;
}

// Does a box at (x, y) of the given size overlap any solid tile?
function boxHitsWall(room, x, y, size) {
  const x0 = Math.floor(x / TILE);
  const y0 = Math.floor(y / TILE);
  const x1 = Math.floor((x + size - 1e-6) / TILE);
  const y1 = Math.floor((y + size - 1e-6) / TILE);
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (isSolid(room, tx, ty)) return true;
    }
  }
  return false;
}

// Move one axis at a time so bodies slide along walls instead of sticking.
// If a move would enter a wall, snap flush against it.
function moveAxis(room, ent, dx, dy) {
  if (dx !== 0) {
    const nx = ent.x + dx;
    if (!boxHitsWall(room, nx, ent.y, ent.size)) {
      ent.x = nx;
    } else if (dx > 0) {
      ent.x = Math.floor((nx + ent.size) / TILE) * TILE - ent.size;
    } else {
      ent.x = (Math.floor(nx / TILE) + 1) * TILE;
    }
  }
  if (dy !== 0) {
    const ny = ent.y + dy;
    if (!boxHitsWall(room, ent.x, ny, ent.size)) {
      ent.y = ny;
    } else if (dy > 0) {
      ent.y = Math.floor((ny + ent.size) / TILE) * TILE - ent.size;
    } else {
      ent.y = (Math.floor(ny / TILE) + 1) * TILE;
    }
  }
}

function centerOf(ent) {
  return { x: ent.x + ent.size / 2, y: ent.y + ent.size / 2 };
}

function distBetween(a, b) {
  const ca = centerOf(a), cb = centerOf(b);
  return Math.hypot(cb.x - ca.x, cb.y - ca.y);
}

// ============================================================
// Shared body pieces: swing, knockback, getting hit
// ============================================================
// A swing carries its own shape, so player and skeleton swings can differ.
function newSwing(angle, arc, reach, time) {
  return { t: 0, angle, arc, reach, time, hit: new Set() }; // hit = ids already struck this swing
}

// Current blade angle during a swing: sweeps across the arc, easing out.
function bladeAngle(swing) {
  const u = Math.min(1, swing.t / swing.time);
  const eased = 1 - (1 - u) * (1 - u);
  return swing.angle - swing.arc / 2 + swing.arc * eased;
}

// Is any part of the box within reach of the blade's path so far?
// Checks points along the blade from the start of the arc to its current angle.
function swingTouches(swinger, box) {
  const s = swinger.swing;
  if (!s) return false;
  const cx = swinger.x + swinger.size / 2;
  const cy = swinger.y + swinger.size / 2;
  const a0 = s.angle - s.arc / 2;
  const a1 = bladeAngle(s);
  const steps = 12;
  for (let i = 0; i <= steps; i++) {
    const a = a0 + (a1 - a0) * (i / steps);
    for (let r = swinger.size / 2; r <= s.reach; r += 6) {
      const px = cx + Math.cos(a) * r;
      const py = cy + Math.sin(a) * r;
      if (px >= box.x && px <= box.x + box.size && py >= box.y && py <= box.y + box.size) return true;
    }
  }
  return false;
}

// Push the target away from the attacker.
function knockBack(target, from) {
  const a = centerOf(from), b = centerOf(target);
  let dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  target.knock = { x: dx / len, y: dy / len, t: KNOCKBACK_TIME };
}

function applyKnockback(room, ent, dt) {
  const k = ent.knock;
  if (!k || k.t <= 0) return;
  const speed = KNOCKBACK_SPEED * (k.t / KNOCKBACK_TIME); // slows to a stop
  moveAxis(room, ent, k.x * speed * dt, 0);
  moveAxis(room, ent, 0, k.y * speed * dt);
  k.t = Math.max(0, k.t - dt);
}

// ============================================================
// Player
// ============================================================
function makePlayer(room) {
  // Start in the middle of the room. x, y = top-left of the hitbox.
  const spawn = room.spawn || { x: (room.w * TILE) / 2, y: (room.h * TILE) / 2 };
  return {
    id: "player",
    x: spawn.x - PLAYER_SIZE / 2,
    y: spawn.y - PLAYER_SIZE / 2,
    size: PLAYER_SIZE,
    hp: PLAYER_MAX_HP,
    iframes: 0,             // >0: can't be hurt
    flash: 0,
    knock: null,
    facing: { x: 0, y: 1 }, // last direction moved; sword swings this way
    swing: null,            // { t, angle, hit: Set } while swinging, else null
    cooldown: 0,            // time until another swing may start
    facingLock: 0,          // >0 after a swing ends: facing can't turn yet
    buffered: 0,            // >0 while a queued swing press is still fresh
    chainAngle: null,       // set when the queued press came mid-swing or just after: next swing repeats this angle
    lastAngle: 0,           // direction of the most recent swing
    sinceSwing: Infinity,   // time since the last swing ended
  };
}

// input = { up, down, left, right, attack }
//   up/down/left/right: held booleans
//   attack: true only on the step the attack key was pressed
function updatePlayer(room, player, input, dt) {
  if (player.iframes > 0) player.iframes = Math.max(0, player.iframes - dt);
  if (player.flash > 0) player.flash = Math.max(0, player.flash - dt);
  applyKnockback(room, player, dt);

  // --- Sword ---
  // Pressing again late in a swing, or within CHAIN_GRACE after it ends, "chains":
  // the next swing goes the same direction even if you're walking another way
  // (lets you back up while swinging). A later press uses your current facing.
  if (!player.swing) player.sinceSwing += dt;
  if (input.attack) {
    player.buffered = SWING_BUFFER;
    if (player.swing) player.chainAngle = player.swing.angle;
    else if (player.sinceSwing <= CHAIN_GRACE) player.chainAngle = player.lastAngle;
    else player.chainAngle = null;
  } else if (player.buffered > 0 && player.cooldown === 0) {
    // The buffer only runs down while a swing could otherwise act on it,
    // so a press late in a swing survives the cooldown that follows.
    player.buffered = Math.max(0, player.buffered - dt);
    if (player.buffered === 0) player.chainAngle = null;
  }

  if (player.swing) {
    player.swing.t += dt;
    if (player.swing.t >= SWING_TIME) {
      player.lastAngle = player.swing.angle;
      player.sinceSwing = 0;
      player.swing = null;
      player.cooldown = SWING_COOLDOWN;
      player.facingLock = FACING_LOCK_EXTRA;
    }
  } else {
    if (player.cooldown > 0) player.cooldown = Math.max(0, player.cooldown - dt);
    if (player.facingLock > 0) player.facingLock = Math.max(0, player.facingLock - dt);
  }
  if (!player.swing && player.cooldown === 0 && player.buffered > 0) {
    player.buffered = 0;
    let angle = Math.atan2(player.facing.y, player.facing.x);
    if (player.chainAngle !== null) {
      angle = player.chainAngle;
      player.facing = { x: Math.cos(angle), y: Math.sin(angle) };
      player.chainAngle = null;
    }
    player.swing = newSwing(angle, SWING_ARC, SWING_REACH, SWING_TIME); // angle locked at swing start
  }

  // --- Movement ---
  let ix = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  let iy = (input.down ? 1 : 0) - (input.up ? 1 : 0);
  if (ix === 0 && iy === 0) return;

  // Diagonals move at the same speed as straight lines.
  const len = Math.hypot(ix, iy);
  ix /= len;
  iy /= len;
  // Facing doesn't turn mid-swing (or just after), so the swing keeps its direction.
  // A queued chained swing also holds facing, so you see the direction it will go.
  if (!player.swing && player.facingLock === 0 && player.chainAngle === null) player.facing = { x: ix, y: iy };

  const dist = PLAYER_SPEED * (player.swing ? SWING_MOVE_MULT : 1) * dt;
  moveAxis(room, player, ix * dist, 0);
  moveAxis(room, player, 0, iy * dist);
}

// ============================================================
// Skeletons
// ============================================================
// Simple brain: idle (wander) until the player comes close, then chase and
// attack. Attacks are telegraphed by a short wind-up; hitting a skeleton
// during its wind-up or swing cancels the attack.
function makeSkeleton(id, x, y, rng, difficulty) {
  const stats = skeletonStats(difficulty || 0);
  return {
    id,
    x, y,
    size: SKEL_SIZE,
    difficulty: difficulty || 0,
    stats,
    hp: stats.hp,
    flash: 0,
    knock: null,
    facing: { x: 0, y: 1 },
    aggro: false,
    swing: null,
    windup: 0,          // >0 while winding up an attack
    windupAngle: 0,
    cooldown: 0,
    stun: 0,
    wanderT: rng() * 1.5,        // time until next wander decision
    wanderDir: null,             // { x, y } or null (standing still)
  };
}

function updateSkeleton(game, sk, dt) {
  const room = game.room, p = game.player, rng = game.rng, st = sk.stats;
  if (sk.flash > 0) sk.flash = Math.max(0, sk.flash - dt);
  if (sk.cooldown > 0) sk.cooldown = Math.max(0, sk.cooldown - dt);
  applyKnockback(room, sk, dt);
  if (sk.stun > 0) { sk.stun = Math.max(0, sk.stun - dt); return; }

  const d = distBetween(sk, p);
  const playerAlive = !game.over;
  if (!sk.aggro && playerAlive && d <= st.aggroRange) sk.aggro = true;
  if (sk.aggro && (!playerAlive || d > st.leashRange)) sk.aggro = false;

  // Swinging
  if (sk.swing) {
    sk.swing.t += dt;
    if (playerAlive && !sk.swing.hit.has(p.id) && swingTouches(sk, p)) {
      sk.swing.hit.add(p.id);
      hurtPlayer(game, sk);
    }
    if (sk.swing.t >= sk.swing.time) {
      sk.swing = null;
      sk.cooldown = st.cooldown;
    }
    return; // stands still while swinging
  }

  // Winding up
  if (sk.windup > 0) {
    sk.windup = Math.max(0, sk.windup - dt);
    if (sk.windup === 0) sk.swing = newSwing(sk.windupAngle, st.swingArc, st.swingReach, st.swingTime);
    return;
  }

  const sc = centerOf(sk), pc = centerOf(p);
  if (sk.aggro) {
    const ax = pc.x - sc.x, ay = pc.y - sc.y;
    const len = Math.hypot(ax, ay) || 1;
    sk.facing = { x: ax / len, y: ay / len };
    if (d <= st.attackRange && sk.cooldown === 0) {
      sk.windup = st.windup;
      sk.windupAngle = Math.atan2(ay, ax);
    } else if (d > st.stopRange) {
      moveAxis(room, sk, sk.facing.x * st.speed * dt, 0);
      moveAxis(room, sk, 0, sk.facing.y * st.speed * dt);
    }
  } else {
    // Wander: alternate between short strolls and standing around.
    sk.wanderT -= dt;
    if (sk.wanderT <= 0) {
      if (rng() < 0.5) {
        const a = rng() * Math.PI * 2;
        sk.wanderDir = { x: Math.cos(a), y: Math.sin(a) };
        sk.facing = sk.wanderDir;
      } else {
        sk.wanderDir = null;
      }
      sk.wanderT = 0.8 + rng() * 1.6;
    }
    if (sk.wanderDir) {
      moveAxis(room, sk, sk.wanderDir.x * st.wanderSpeed * dt, 0);
      moveAxis(room, sk, 0, sk.wanderDir.y * st.wanderSpeed * dt);
    }
  }
}

// Skeletons nudge each other apart so they don't stack into one blob.
function separateSkeletons(game, dt) {
  const list = game.skeletons;
  for (let i = 0; i < list.length; i++) {
    for (let j = i + 1; j < list.length; j++) {
      const a = list[i], b = list[j];
      const ca = centerOf(a), cb = centerOf(b);
      let dx = cb.x - ca.x, dy = cb.y - ca.y;
      let d = Math.hypot(dx, dy);
      const min = (a.size + b.size) / 2 + 4;
      if (d >= min) continue;
      if (d < 1e-6) { dx = 1; dy = 0; d = 1; }
      const push = Math.min((min - d) / 2, 120 * dt);
      moveAxis(game.room, a, (-dx / d) * push, (-dy / d) * push);
      moveAxis(game.room, b, (dx / d) * push, (dy / d) * push);
    }
  }
}

function spawnWave(game, count) {
  const p = game.player, rng = game.rng, room = game.room;
  for (let n = 0; n < count; n++) {
    for (let tries = 0; tries < 200; tries++) {
      const x = TILE + rng() * ((room.w - 2) * TILE - SKEL_SIZE);
      const y = TILE + rng() * ((room.h - 2) * TILE - SKEL_SIZE);
      const probe = { x, y, size: SKEL_SIZE };
      if (boxHitsWall(room, x, y, SKEL_SIZE)) continue;
      if (distBetween(probe, p) < SPAWN_MIN_DIST) continue;
      if (game.skeletons.some((s) => distBetween(probe, s) < SKEL_SIZE * 2)) continue;
      game.skeletons.push(makeSkeleton(game.nextId++, x, y, rng, game.difficulty));
      break;
    }
  }
}

// ============================================================
// Combat
// ============================================================
function hurtPlayer(game, attacker) {
  const p = game.player;
  if (p.iframes > 0 || game.over) return;
  p.hp -= attacker.stats ? Math.round(attacker.stats.damage) : 1;
  p.iframes = PLAYER_IFRAMES;
  p.flash = HIT_FLASH;
  knockBack(p, attacker);
  if (p.hp <= 0) {
    p.hp = 0;
    p.swing = null;
    game.over = true;
  }
}

function playerAttacks(game) {
  const p = game.player;
  if (!p.swing) return;
  for (const sk of game.skeletons) {
    if (sk.hp <= 0 || p.swing.hit.has(sk.id) || !swingTouches(p, sk)) continue;
    p.swing.hit.add(sk.id); // one hit per swing per target
    sk.hp -= 1;
    sk.flash = HIT_FLASH;
    sk.stun = sk.stats.stun;
    sk.aggro = true;
    sk.windup = 0;          // interrupt its attack
    sk.swing = null;
    knockBack(sk, p);
    if (sk.hp <= 0) {
      game.effects.push({ kind: "bones", x: sk.x, y: sk.y, size: sk.size, t: 0.4, max: 0.4 });
      game.kills++;
    }
  }
  game.skeletons = game.skeletons.filter((s) => s.hp > 0);
}

// ============================================================
// Game state
// ============================================================
// Areas: "maze" (maze floor 1, with the safe room at its centre, where the game
// starts) and "arena" (the one-screen room with skeleton waves, kept for
// testing combat until the maze has enemies).
// opts.area: which area to start in (default "maze")
// opts.skeletons === false: no skeleton waves in the arena (used by movement tests)
function makeGame(seed, opts) {
  const area = (opts && opts.area) || "maze";
  const floorCells = (opts && opts.floorCells) || FLOOR_CELLS; // opts.floorCells: smaller floors for tests
  const room = area === "maze" ? makeFirstFloor(floorCells) : makeRoom(ROOM_W, ROOM_H);
  const game = {
    floorCells,
    area,
    room,
    player: makePlayer(room),
    floorNum: 1,           // current maze floor
    deepestFloor: 0,       // deepest maze floor reached (picks the NPC's lines)
    npcTalking: false,     // player is near the NPC right now
    npcLine: -1,           // index into the current line group
    healTimer: 0,
    skeletons: [],
    effects: [],
    rng: makeRng(seed === undefined ? 1 : seed),
    nextId: 1,
    kills: 0,
    waveTimer: 0,
    over: false,
    waves: !(opts && opts.skeletons === false),
    difficulty: (opts && opts.difficulty) || 0, // skeleton difficulty for new waves (testing keys 1-5)
  };
  if (game.waves && area === "arena") spawnWave(game, WAVE_SIZE);
  if (area === "maze") { growMaze(game); computeVisibility(game); }
  return game;
}

// Testing: hop between the maze and the arena (key T). Keeps your HP.
function switchArea(game) {
  const hp = game.player.hp;
  game.area = game.area === "maze" ? "arena" : "maze";
  game.room = game.area === "maze" ? makeFirstFloor(game.floorCells) : makeRoom(ROOM_W, ROOM_H);
  game.player = makePlayer(game.room);
  game.player.hp = hp;
  game.skeletons = [];
  game.effects = [];
  game.waveTimer = 0;
  game.npcTalking = false;
  if (game.area === "arena" && game.waves) spawnWave(game, WAVE_SIZE);
  if (game.area === "maze") { growMaze(game); computeVisibility(game); }
}

// ---------- Safe room behaviour ----------
function playerTileUnderCenter(game) {
  const c = centerOf(game.player);
  return tileAt(game.room, Math.floor(c.x / TILE), Math.floor(c.y / TILE));
}

function npcLineGroup(game) {
  let group = NPC_LINES[0];
  for (const g of NPC_LINES) if (game.deepestFloor >= g.minFloor) group = g;
  return group;
}

function updateSafeRoom(game, dt) {
  const p = game.player, room = game.room;

  // Healing nook
  if (playerTileUnderCenter(game) === HEAL && p.hp < PLAYER_MAX_HP) {
    game.healTimer += dt;
    if (game.healTimer >= HEAL_INTERVAL) {
      game.healTimer -= HEAL_INTERVAL;
      p.hp += 1;
      game.effects.push({ kind: "heal", x: p.x + p.size / 2, y: p.y, t: 0.6, max: 0.6 });
    }
  } else {
    game.healTimer = 0;
  }

  // NPC: starts a new line each time you walk up to him.
  if (room.npc) {
    const npcBox = { x: room.npc.tx * TILE, y: room.npc.ty * TILE, size: TILE };
    const near = distBetween(p, npcBox) <= NPC_TALK_RANGE;
    if (near && !game.npcTalking) {
      const lines = npcLineGroup(game).lines;
      game.npcLine = (game.npcLine + 1) % lines.length;
    }
    game.npcTalking = near;
  }
}

// Testing helper: change skeleton difficulty and replace the current wave.
function setDifficulty(game, d) {
  game.difficulty = d;
  game.skeletons = [];
  game.waveTimer = 0;
  spawnWave(game, WAVE_SIZE);
}

function stepGame(game, input, dt) {
  if (game.over) {
    for (const sk of game.skeletons) updateSkeleton(game, sk, dt); // they mill about
    return;
  }
  updatePlayer(game.room, game.player, input, dt);
  if (game.area === "maze") {
    updateSafeRoom(game, dt);
    growMaze(game);
    computeVisibility(game);
  }
  playerAttacks(game);
  for (const sk of game.skeletons) updateSkeleton(game, sk, dt);
  separateSkeletons(game, dt);

  for (const e of game.effects) e.t -= dt;
  game.effects = game.effects.filter((e) => e.t > 0);

  // Next wave once the room is clear.
  if (game.area === "arena" && game.waves && game.skeletons.length === 0) {
    game.waveTimer += dt;
    if (game.waveTimer >= WAVE_DELAY) {
      game.waveTimer = 0;
      spawnWave(game, WAVE_SIZE);
    }
  }
}

// ============================================================
// Drawing
// ============================================================
// Camera: keeps the player centred, but stops at the edges of the map.
function cameraFor(game) {
  const c = centerOf(game.player);
  const maxX = Math.max(0, game.room.w * TILE - VIEW_W);
  const maxY = Math.max(0, game.room.h * TILE - VIEW_H);
  return {
    x: Math.round(Math.min(maxX, Math.max(0, c.x - VIEW_W / 2))),
    y: Math.round(Math.min(maxY, Math.max(0, c.y - VIEW_H / 2))),
  };
}

function drawRoom(ctx, room, cam) {
  const tx0 = Math.max(0, Math.floor(cam.x / TILE)), tx1 = Math.min(room.w - 1, Math.floor((cam.x + VIEW_W) / TILE));
  const ty0 = Math.max(0, Math.floor(cam.y / TILE)), ty1 = Math.min(room.h - 1, Math.floor((cam.y + VIEW_H) / TILE));
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      const t = tileAt(room, tx, ty);
      const px = tx * TILE, py = ty * TILE;
      if (t === WALL) {
        ctx.fillStyle = "#4a4a58";
        ctx.fillRect(px, py, TILE, TILE);
        ctx.fillStyle = "#3a3a46";
        ctx.fillRect(px, py + TILE - 6, TILE, 6);
      } else if (t === VOID) {
        ctx.fillStyle = "#0b0a0c";
        ctx.fillRect(px, py, TILE, TILE);
      } else if (t === HEAL) {
        ctx.fillStyle = (tx + ty) % 2 === 0 ? "#3fbf9f" : "#47c9a8";
        ctx.fillRect(px, py, TILE, TILE);
      } else if (t === DOOR) {
        // Open doorway: worn stone threshold.
        ctx.fillStyle = "#3a332b";
        ctx.fillRect(px, py, TILE, TILE);
        ctx.fillStyle = "#4a4136";
        ctx.fillRect(px, py + 4, TILE, 4);
        ctx.fillRect(px, py + TILE - 8, TILE, 4);
      } else {
        // Subtle checker so movement is easy to see.
        ctx.fillStyle = (tx + ty) % 2 === 0 ? "#26221e" : "#2b2621";
        ctx.fillRect(px, py, TILE, TILE);
      }
    }
  }
}

// Soft shimmer over the heal tiles so the nook reads as special.
function drawHealGlow(ctx, room, time) {
  const r = room.safeRect;
  if (!r) return;
  ctx.fillStyle = `rgba(160, 255, 230, ${0.08 + 0.06 * Math.sin(time * 2.5)})`;
  for (let ty = r.y0; ty <= r.y1; ty++)
    for (let tx = r.x0; tx <= r.x1; tx++)
      if (tileAt(room, tx, ty) === HEAL) ctx.fillRect(tx * TILE, ty * TILE, TILE, TILE);
}

// Darkness over the map: black where you've never looked, dim where you've
// been, and fading toward the edge of your torchlight.
function drawLighting(ctx, game, cam) {
  const room = game.room;
  if (!room.seen) return;
  const pc = centerOf(game.player);
  const tx0 = Math.max(0, Math.floor(cam.x / TILE)), tx1 = Math.min(room.w - 1, Math.floor((cam.x + VIEW_W) / TILE));
  const ty0 = Math.max(0, Math.floor(cam.y / TILE)), ty1 = Math.min(room.h - 1, Math.floor((cam.y + VIEW_H) / TILE));
  const lit = inSafeRoom(game);
  for (let ty = ty0; ty <= ty1; ty++)
    for (let tx = tx0; tx <= tx1; tx++) {
      const i = ty * room.w + tx;
      let a;
      if (!room.seen[i]) a = 1;
      else if (!room.visible[i]) a = EXPLORED_DARK;
      else if (lit && room.safeRect && tx >= room.safeRect.x0 - 1 && tx <= room.safeRect.x1 + 1 &&
               ty >= room.safeRect.y0 - 1 && ty <= room.safeRect.y1 + 1) a = 0;
      else {
        const d = Math.hypot((tx + 0.5) * TILE - pc.x, (ty + 0.5) * TILE - pc.y);
        a = Math.max(0, Math.min(1, (d - TORCH_FULL) / (TORCH_RADIUS - TORCH_FULL))) * 0.6;
      }
      if (a <= 0) continue;
      ctx.fillStyle = a >= 1 ? "#0b0a0c" : `rgba(11, 10, 12, ${a})`;
      ctx.fillRect(tx * TILE, ty * TILE, TILE, TILE);
    }
}

function drawNpc(ctx, room) {
  if (!room.npc) return;
  const x = room.npc.tx * TILE, y = room.npc.ty * TILE;
  // Floor under him
  ctx.fillStyle = (room.npc.tx + room.npc.ty) % 2 === 0 ? "#26221e" : "#2b2621";
  ctx.fillRect(x, y, TILE, TILE);
  // Robe
  ctx.fillStyle = "#4b3a6b";
  ctx.fillRect(x + 4, y + 8, TILE - 8, TILE - 8);
  // Hood
  ctx.fillStyle = "#3a2c55";
  ctx.fillRect(x + 7, y + 2, TILE - 14, 12);
  // Eyes glinting in the hood
  ctx.fillStyle = "#e8d48a";
  ctx.fillRect(x + 12, y + 8, 2, 2);
  ctx.fillRect(x + 18, y + 8, 2, 2);
  // Staff
  ctx.fillStyle = "#7a5a34";
  ctx.fillRect(x + TILE - 5, y - 6, 3, TILE + 4);
}

// Word-wrap text into lines no wider than maxW.
function wrapText(ctx, text, maxW) {
  const words = text.split(" "), lines = [];
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function drawSpeech(ctx, game, cam) {
  const room = game.room;
  if (!room.npc || !game.npcTalking || game.npcLine < 0) return;
  const text = npcLineGroup(game).lines[game.npcLine % npcLineGroup(game).lines.length];
  ctx.font = "14px monospace";
  const lines = wrapText(ctx, text, 260);
  const lh = 18, padX = 10, padY = 8;
  const w = Math.max(...lines.map((l) => ctx.measureText(l).width)) + padX * 2;
  const h = lines.length * lh + padY * 2;
  const cx = room.npc.tx * TILE + TILE / 2;
  let bx = Math.min(Math.max(cx - w / 2, cam.x + 8), cam.x + VIEW_W - w - 8);
  const by = room.npc.ty * TILE - h - 16;
  ctx.fillStyle = "rgba(20, 16, 28, 0.92)";
  ctx.fillRect(bx, by, w, h);
  ctx.strokeStyle = "#8c7ab8";
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, w, h);
  // little tail pointing at him
  ctx.fillStyle = "#8c7ab8";
  ctx.beginPath();
  ctx.moveTo(cx - 6, by + h); ctx.lineTo(cx + 6, by + h); ctx.lineTo(cx, by + h + 8);
  ctx.fill();
  ctx.fillStyle = "#ece4f6";
  ctx.textAlign = "left";
  lines.forEach((l, i) => ctx.fillText(l, bx + padX, by + padY + 13 + i * lh));
}

function drawPlayer(ctx, p, over) {
  // Blink while invincible.
  if (!over && p.iframes > 0 && Math.floor(p.iframes * 20) % 2 === 0) return;
  const cx = p.x + p.size / 2;
  const cy = p.y + p.size / 2;
  ctx.fillStyle = p.flash > 0 ? "#ffffff" : over ? "#6b5a34" : "#d9b45a";
  ctx.fillRect(p.x, p.y, p.size, p.size);
  ctx.strokeStyle = "#7a5c1e";
  ctx.lineWidth = 2;
  ctx.strokeRect(p.x + 1, p.y + 1, p.size - 2, p.size - 2);
  if (over) return;
  // Facing marker
  ctx.fillStyle = "#fff4d0";
  ctx.beginPath();
  ctx.arc(cx + p.facing.x * 7, cy + p.facing.y * 7, 3, 0, Math.PI * 2);
  ctx.fill();
}

function drawSkeleton(ctx, sk) {
  const cx = sk.x + sk.size / 2;
  const cy = sk.y + sk.size / 2;
  ctx.fillStyle = sk.flash > 0 ? "#ffffff" : "#d8d4c6";
  ctx.fillRect(sk.x, sk.y, sk.size, sk.size);
  ctx.strokeStyle = "#7d786a";
  ctx.lineWidth = 2;
  ctx.strokeRect(sk.x + 1, sk.y + 1, sk.size - 2, sk.size - 2);
  // Eyes look where it faces; red when it has noticed you.
  const fx = sk.facing.x, fy = sk.facing.y;
  const px = -fy, py = fx; // perpendicular
  ctx.fillStyle = sk.aggro ? "#d0342c" : "#2a2622";
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(cx + fx * 5 + px * 4 * side, cy + fy * 5 + py * 4 * side, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
  // Wind-up telegraph: blade drawn back, glowing brighter as the swing nears.
  if (sk.windup > 0) {
    const k = 1 - sk.windup / sk.stats.windup;
    const a = sk.windupAngle - sk.stats.swingArc / 2 - 0.5;
    ctx.strokeStyle = `rgba(255, 120, 90, ${0.35 + 0.65 * k})`;
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * (sk.size / 2), cy + Math.sin(a) * (sk.size / 2));
    ctx.lineTo(cx + Math.cos(a) * sk.stats.swingReach, cy + Math.sin(a) * sk.stats.swingReach);
    ctx.stroke();
    ctx.lineCap = "butt";
  }
  // Health pips (only once damaged)
  if (sk.hp < sk.stats.hp) {
    for (let i = 0; i < sk.stats.hp; i++) {
      ctx.fillStyle = i < sk.hp ? "#d0342c" : "#3a2a28";
      ctx.fillRect(sk.x + i * 7, sk.y - 7, 5, 3);
    }
  }
}

function drawSwing(ctx, ent, trail, blade) {
  const s = ent.swing;
  if (!s) return;
  const cx = ent.x + ent.size / 2;
  const cy = ent.y + ent.size / 2;
  const a0 = s.angle - s.arc / 2;
  const a = bladeAngle(s);
  // Faint trail over the part of the arc already swept
  ctx.fillStyle = trail;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, s.reach, a0, a);
  ctx.closePath();
  ctx.fill();
  // Blade
  ctx.strokeStyle = blade;
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(a) * (ent.size / 2), cy + Math.sin(a) * (ent.size / 2));
  ctx.lineTo(cx + Math.cos(a) * s.reach, cy + Math.sin(a) * s.reach);
  ctx.stroke();
  ctx.lineCap = "butt";
}

function drawEffects(ctx, game) {
  for (const e of game.effects) {
    if (e.kind === "heal") {
      const k = e.t / e.max;
      ctx.fillStyle = `rgba(140, 255, 210, ${k})`;
      ctx.font = "bold 14px monospace";
      ctx.textAlign = "center";
      ctx.fillText("+1", e.x, e.y - 6 - (1 - k) * 18);
      continue;
    }
    if (e.kind !== "bones") continue;
    const k = e.t / e.max;           // 1 → 0
    const spread = (1 - k) * 10;
    ctx.fillStyle = `rgba(216, 212, 198, ${k})`;
    const c = e.size / 2;
    for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      ctx.fillRect(e.x + c + dx * spread - 4, e.y + c + dy * spread - 4, 8, 8);
    }
  }
}

function drawHud(ctx, game) {
  const p = game.player;
  for (let i = 0; i < PLAYER_MAX_HP; i++) {
    ctx.fillStyle = i < p.hp ? "#d0342c" : "#2a1c1c";
    ctx.fillRect(10 + i * 22, 9, 16, 14);
    ctx.strokeStyle = "#1a1212";
    ctx.lineWidth = 2;
    ctx.strokeRect(10 + i * 22, 9, 16, 14);
  }
  ctx.fillStyle = "#cfc6b8";
  ctx.font = "14px monospace";
  ctx.textAlign = "right";
  if (game.area === "arena") ctx.fillText("Skeletons slain: " + game.kills, VIEW_W - 12, 21);
  else ctx.fillText("Floor " + game.floorNum + (inSafeRoom(game) ? "  \u00b7  Safe room" : ""), VIEW_W - 12, 21);
  ctx.textAlign = "center";
  ctx.fillStyle = "#9c9486";
  ctx.font = "12px monospace";
  const hint = game.area === "arena"
    ? "Test arena  |  Skeleton difficulty " + game.difficulty.toFixed(2) + " (keys 1-5)  |  T: back to the maze"
    : "T: test arena (until the maze has enemies)";
  ctx.fillText(hint, VIEW_W / 2, VIEW_H - 10);

  if (game.over) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#e8dcc4";
    ctx.font = "40px monospace";
    ctx.fillText("You died", VIEW_W / 2, VIEW_H / 2 - 10);
    ctx.font = "16px monospace";
    ctx.fillText("Press R to return to the safe room", VIEW_W / 2, VIEW_H / 2 + 24);
  }
}

function draw(ctx, game, time) {
  const cam = cameraFor(game);
  ctx.fillStyle = "#0b0a0c";
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.save();
  ctx.translate(-cam.x, -cam.y);          // world space from here...
  drawRoom(ctx, game.room, cam);
  drawHealGlow(ctx, game.room, time || 0);
  drawNpc(ctx, game.room);
  for (const sk of game.skeletons) drawSkeleton(ctx, sk);
  drawPlayer(ctx, game.player, game.over);
  for (const sk of game.skeletons) drawSwing(ctx, sk, "rgba(255, 110, 80, 0.20)", "#f0c8b8");
  drawSwing(ctx, game.player, "rgba(230, 235, 255, 0.18)", "#e8ecf8");
  drawEffects(ctx, game);
  drawLighting(ctx, game, cam);
  drawSpeech(ctx, game, cam);
  ctx.restore();                           // ...screen space from here
  drawHud(ctx, game);
}

// ============================================================
// Browser loop (skipped when loaded headless for tests)
// ============================================================
if (typeof window !== "undefined" && typeof document !== "undefined" && document.getElementById) {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let game = makeGame((Math.random() * 1e9) | 0);
  const input = { up: false, down: false, left: false, right: false, attack: false };
  let attackPressed = false; // set by keydown, consumed by the next simulation step

  const KEYMAP = {
    KeyW: "up", ArrowUp: "up",
    KeyS: "down", ArrowDown: "down",
    KeyA: "left", ArrowLeft: "left",
    KeyD: "right", ArrowRight: "right",
  };
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      if (!e.repeat) attackPressed = true; // one swing per press; holding doesn't auto-swing
      e.preventDefault();
      return;
    }
    if (e.code === "KeyR" && game.over) {
      // Back to the checkpoint: the safe room, full health.
      game = makeGame((Math.random() * 1e9) | 0, { difficulty: game.difficulty });
      return;
    }
    if (e.code === "KeyT" && !game.over) {
      switchArea(game);
      return;
    }
    // Testing: 1-5 set skeleton difficulty (0, 0.25, 0.5, 0.75, 1) and respawn the wave.
    const digit = ["Digit1", "Digit2", "Digit3", "Digit4", "Digit5"].indexOf(e.code);
    if (digit >= 0 && !game.over && game.area === "arena") {
      setDifficulty(game, digit / 4);
      return;
    }
    const k = KEYMAP[e.code];
    if (k) { input[k] = true; e.preventDefault(); }
  });
  window.addEventListener("keyup", (e) => {
    const k = KEYMAP[e.code];
    if (k) { input[k] = false; e.preventDefault(); }
  });
  // Don't keep walking if the window loses focus mid-keypress.
  window.addEventListener("blur", () => {
    input.up = input.down = input.left = input.right = false;
  });

  let last = performance.now();
  let acc = 0;
  function frame(now) {
    acc += Math.min(0.25, (now - last) / 1000);
    last = now;
    while (acc >= STEP) {
      input.attack = attackPressed;
      attackPressed = false;
      stepGame(game, input, STEP);
      acc -= STEP;
    }
    draw(ctx, game, now / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
